
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>야무진 픽노트 | 팝업 캘린더</title>
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
 margin:0;
 background:#f6f8f3;
 color:#294234;
 font-family:-apple-system,BlinkMacSystemFont,
 "Apple SD Gothic Neo",sans-serif;
}
main{max-width:760px;margin:auto;padding:16px 14px 50px}
.hero{
 background:#dcebd5;
 padding:16px;
 border-radius:26px;
}
.hero img{
 width:100%;
 display:block;
 border-radius:20px;
 cursor:pointer;
}
.panel{
 background:white;
 border-radius:24px;
 padding:18px;
 margin-top:20px;
 box-shadow:0 5px 20px #263d3010;
}
nav{
 display:flex;
 align-items:center;
 justify-content:space-between;
 margin-bottom:20px;
}
nav button{
 background:#e5efe3;
 border:0;
 border-radius:13px;
 padding:12px 17px;
 color:#34734e;
 font-size:22px;
 cursor:pointer;
}
nav button:disabled{opacity:.25}
#range{font-size:18px;font-weight:800;text-align:center}
.week{
 display:grid;
 grid-template-columns:repeat(7,minmax(0,1fr));
 gap:5px;
}
.day{
 border:1px solid #e2e8e0;
 border-radius:13px;
 min-height:125px;
 padding:8px 3px;
 text-align:center;
}
.today{border:2px solid #438d60}
.outside{opacity:.3}
.dayname{font-size:12px;color:#85948a}
.date{font-size:16px;font-weight:bold;margin:10px 0}
.cat{
 width:100%;
 display:block;
 border:0;
 border-radius:8px;
 padding:8px 1px;
 margin:5px 0;
 font-size:11px;
 font-weight:bold;
 cursor:pointer;
 overflow-wrap:anywhere;
}
.beauty{background:#fce1eb;color:#a34466}
.fashion{background:#e9def9;color:#744b9c}
.tech{background:#dceafa;color:#315e96}
.goods{background:#fff0cb;color:#94631b}
.life{background:#e0f0df;color:#31744c}
.food{background:#ffe4d5;color:#98532f}
.item{border-bottom:1px solid #edf0ea;padding:17px 0}
.item:last-child{border:0}
.item h3{margin:6px 0;font-size:17px}
.item p{font-size:13px;line-height:1.7;color:#647469}
.link{
 display:inline-block;
 background:#388456;
 color:white;
 text-decoration:none;
 padding:12px 16px;
 border-radius:12px;
 font-size:13px;
 font-weight:bold;
}
.empty{
 text-align:center;
 padding:25px 0;
 color:#89958c;
 font-size:14px;
}
.hint{
 text-align:center;
 color:#89958c;
 font-size:12px;
 margin-top:20px;
}
footer{
 text-align:center;
 color:#89958c;
 font-size:12px;
 margin-top:30px;
}
</style>
</head>
<body>
<main>

<section class="hero">
<img
 src="66293676-C7C2-4089-8697-06C93391229A.png"
 alt="야무진 팝업 캘린더 보러가기"
 onclick="document.getElementById('calendar').scrollIntoView({behavior:'smooth'})"
>
</section>

<section class="panel" id="calendar">
<nav>
<button id="prev" onclick="move(-1)">‹</button>
<div id="range"></div>
<button id="next" onclick="move(1)">›</button>
</nav>
<div class="week" id="week"></div>
<p class="hint">카테고리를 누르면 해당 날짜의 팝업을 확인할 수 있어요.</p>
</section>

<section class="panel" id="detail">
<h2 id="selected">팝업스토어 안내</h2>
<div id="results" class="empty">
달력의 카테고리를 선택해 주세요.
</div>
</section>

<footer>
© 야무진 픽노트 · 행사 정보는 공식 안내를 확인하세요.
</footer>
</main>

<script>
"use strict";

const categories={
 beauty:{name:"뷰티",css:"beauty"},
 fashion:{name:"패션",css:"fashion"},
 tech:{name:"가전·IT",css:"tech"},
 goods:{name:"캐릭터",css:"goods"},
 life:{name:"라이프",css:"life"},
 food:{name:"푸드",css:"food"}
};

// 테스트용 행사 데이터
// 실제 행사 정보는 공식 안내 확인 후 교체
const events=[
 {
  name:"뷰티 팝업 테스트",
  category:"beauty",
  start:"2026-11-09",
  end:"2026-11-15",
  place:"서울 성수동",
  description:"달력 기능 확인을 위한 테스트 행사입니다.",
  url:"https://www.google.com/search?q=성수동+뷰티+팝업스토어"
 },
 {
  name:"패션 팝업 테스트",
  category:"fashion",
  start:"2026-11-13",
  end:"2026-11-15",
  place:"서울 성수동",
  description:"패션 카테고리와 외부 링크 이동 테스트입니다.",
  url:"https://www.google.com/search?q=성수동+패션+팝업스토어"
 }
];

const today=new Date();
const initialMonth=today.getMonth();
const initialYear=today.getFullYear();
let current=new Date(
 initialYear,initialMonth,today.getDate()
);

const weekdays=["일","월","화","수","목","금","토"];

function dateKey(d){
 const y=d.getFullYear();
 const m=String(d.getMonth()+1).padStart(2,"0");
 const day=String(d.getDate()).padStart(2,"0");
 return y+"-"+m+"-"+day;
}

function monday(d){
 const x=new Date(d);
 x.setDate(x.getDate()-(x.getDay()+6)%7);
 return x;
}

function active(date,category){
 return events.filter(e=>
  e.start<=date &&
  e.end>=date &&
  (!category||e.category===category)
 );
}

function render(){
 const start=monday(current);
 const end=new Date(start);
 end.setDate(start.getDate()+6);

 document.getElementById("range").textContent=
 (start.getMonth()+1)+"/"+start.getDate()+
 " ~ "+
 (end.getMonth()+1)+"/"+end.getDate();

 const container=document.getElementById("week");
 container.innerHTML="";

 for(let i=0;i<7;i++){
  const d=new Date(start);
  d.setDate(start.getDate()+i);

  const key=dateKey(d);
  const cell=document.createElement("div");

  cell.className="day";
  if(key===dateKey(today))cell.classList.add("today");
  if(d.getMonth()!==initialMonth)cell.classList.add("outside");

  const dayname=document.createElement("div");
  dayname.className="dayname";
  dayname.textContent=weekdays[d.getDay()];

  const number=document.createElement("div");
  number.className="date";
  number.textContent=d.getDate();

  cell.append(dayname,number);

  if(d.getMonth()===initialMonth){
   Object.keys(categories).forEach(id=>{
    if(active(key,id).length>0){
     const btn=document.createElement("button");
     btn.className="cat "+categories[id].css;
     btn.textContent=categories[id].name;
     btn.onclick=()=>show(key,id);
     cell.appendChild(btn);
    }
   });
  }

  container.appendChild(cell);
 }

 const previous=new Date(current);
 previous.setDate(previous.getDate()-7);

 const next=new Date(current);
 next.setDate(next.getDate()+7);

 document.getElementById("prev").disabled=
 previous.getMonth()!==initialMonth;

 document.getElementById("next").disabled=
 next.getMonth()!==initialMonth;
}

function move(direction){
 const next=new Date(current);
 next.setDate(next.getDate()+direction*7);

 if(next.getFullYear()!==initialYear ||
    next.getMonth()!==initialMonth)return;

 current=next;
 render();
}

function show(date,category){
 const list=active(date,category);
 const selected=document.getElementById("selected");
 const result=document.getElementById("results");

 selected.textContent=
 date.slice(5,7)+"월 "+
 date.slice(8,10)+"일 · "+
 categories[category].name;

 result.innerHTML="";
 result.className="";

 list.forEach(e=>{
  const item=document.createElement("div");
  item.className="item";

  const title=document.createElement("h3");
  title.textContent=e.name;

  const place=document.createElement("p");
  place.textContent="📍 "+e.place;

  const period=document.createElement("p");
  period.textContent="📅 "+e.start+" ~ "+e.end;

  const desc=document.createElement("p");
  desc.textContent=e.description;

  item.append(title,place,period,desc);

  if(e.url){
   const link=document.createElement("a");
   link.className="link";
   link.href=e.url;
   link.target="_blank";
   link.rel="noopener noreferrer";
   link.textContent="행사 정보 보러가기 →";
   item.appendChild(link);
  }

  result.appendChild(item);
 });

 document.getElementById("detail")
 .scrollIntoView({behavior:"smooth",block:"start"});
}

render();
</script>
</body>
</html>
