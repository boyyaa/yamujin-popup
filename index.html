
<!DOCTYPE html>
<html lang="ko">
<head>
 <script async src="https://www.googletagmanager.com/gtm.js?id=GTM-P348LFCD"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>야무진 픽노트 | 팝업 캘린더</title>
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
 margin:0;background:#f6f8f3;color:#294234;
 font-family:-apple-system,BlinkMacSystemFont,
 "Apple SD Gothic Neo",sans-serif
}
main{max-width:760px;margin:auto;padding:16px 14px 50px}
.hero{background:#dcebd5;padding:16px;border-radius:26px}
.hero img{
 width:100%;display:block;border-radius:20px;cursor:pointer
}
.panel{
 background:white;border-radius:24px;padding:18px;
 margin-top:20px;box-shadow:0 5px 20px #263d3010
}
.blog-intro{text-align:center}
.blog-intro h2{font-size:19px;margin:4px 0 8px}
.blog-intro p{
 font-size:13px;color:#738478;line-height:1.6
}
.blog-link{
 display:block;padding:13px;background:#398458;
 color:white;border-radius:12px;text-decoration:none;
 font-weight:bold;margin-top:14px;text-align:center
}
nav{
 display:flex;align-items:center;
 justify-content:space-between;gap:8px;margin-bottom:16px
}
button{cursor:pointer;font-family:inherit}
nav button{
 background:#e5efe3;border:0;border-radius:13px;
 padding:10px 16px;color:#34734e;font-size:22px
}
#range{font-size:17px;font-weight:800;text-align:center}
.monthbar{
 display:flex;align-items:center;justify-content:center;
 gap:10px;margin-bottom:18px
}
.monthbar select{
 border:1px solid #d5e3d4;background:white;
 color:#294234;border-radius:9px;padding:8px;font-size:14px
}
#goToday{
 border:0;background:#e5efe3;color:#34734e;
 border-radius:9px;padding:8px 12px;font-size:13px
}
.week{
 display:grid;
 grid-template-columns:repeat(7,minmax(0,1fr));
 gap:5px
}
.day{
 border:1px solid #e2e8e0;border-radius:13px;
 min-height:260px;padding:5px 2px;
 text-align:center;background:white;min-width:0
}
.day.selected{border:2px solid #438d60}
.day.today .date{color:#27814b}
.dateButton{
 width:100%;background:white;border:0;
 border-radius:9px;padding:8px 0 10px;color:#294234
}
.dateButton.active{background:#e2f1e6}
.dayname{font-size:11px;color:#85948a}
.date{font-size:16px;font-weight:bold;margin-top:6px}
.cat{
 width:100%;display:block;
 border:2px solid transparent;border-radius:7px;
 padding:8px 0;margin:4px 0;
 font-size:10px;font-weight:bold;overflow-wrap:anywhere;
 transition:background-color .15s ease,
 transform .12s ease,box-shadow .15s ease;
 box-shadow:0 3px 0 rgba(0,0,0,.12);
 -webkit-tap-highlight-color:transparent
}
.cat:active{
 transform:translateY(2px);
 box-shadow:0 1px 0 rgba(0,0,0,.12)
}
.cat.active{
 color:white;transform:translateY(2px);
 box-shadow:inset 0 2px 5px rgba(0,0,0,.14);
 border-color:transparent
}
.beauty{background:#fce1eb;color:#a34466}
.fashion{background:#e9def9;color:#744b9c}
.tech{background:#dceafa;color:#315e96}
.goods{background:#fff0cb;color:#94631b}
.life{background:#e0f0df;color:#31744c}
.food{background:#ffe4d5;color:#98532f}
.beauty.active{background:#c94d77}
.fashion.active{background:#8450b3}
.tech.active{background:#4279b7}
.goods.active{background:#c38a2b}
.life.active{background:#448a58}
.food.active{background:#d77d4a}
.item{
 border-bottom:1px solid #edf0ea;padding:17px 0
}
.item:last-child{border:0}
.item h3{margin:6px 0;font-size:17px}
.item p{
 font-size:13px;line-height:1.7;color:#647469
}
.link{
 display:inline-block;background:#388456;color:white;
 text-decoration:none;padding:12px 16px;
 border-radius:12px;font-size:13px;font-weight:bold;
 margin:4px 6px 4px 0
}
.link.secondary{background:#e5efe3;color:#34734e}
.empty{
 text-align:center;padding:25px 0;
 color:#89958c;font-size:14px
}
.hint{
 text-align:center;color:#89958c;
 font-size:12px;margin-top:20px
}
footer{
 text-align:center;color:#89958c;
 font-size:12px;margin-top:30px
}
@media(max-width:390px){
 main{padding:12px 7px 40px}
 .panel{padding:10px}
 .week{gap:3px}
 .day{padding:4px 1px;min-height:255px}
 .cat{font-size:9px;padding:8px 0}
 .date{font-size:14px}
}
@media(prefers-reduced-motion:reduce){
 html{scroll-behavior:auto}
 .cat{transition:none}
}
</style>
</head>
<body>
<main>

<section class="hero">
<img
 src="66293676-C7C2-4089-8697-06C93391229A.png"
 alt="야무진 팝업 캘린더"
 onclick="document.getElementById('calendar').scrollIntoView({behavior:'smooth'})">
</section>

<section class="panel blog-intro">
<h2>야무진 픽노트</h2>
<p>
 팝업 소식부터 쇼핑 할인정보까지!<br>
 놓치기 아까운 정보를 한눈에 확인하세요.
</p>
<a class="blog-link"
 href="https://blog.naver.com/boyyaa"
 target="_blank"
 rel="noopener noreferrer">
 야무진 픽노트 블로그 바로가기 ↗
</a>
</section>

<section class="panel" id="calendar">
<div class="monthbar">
<select id="yearSelect" aria-label="연도"></select>
<select id="monthSelect" aria-label="월"></select>
<button id="goToday">오늘</button>
</div>

<nav>
<button id="prev" aria-label="이전 주">‹</button>
<div id="range"></div>
<button id="next" aria-label="다음 주">›</button>
</nav>

<div class="week" id="week"></div>
<p class="hint">
 흰색 날짜를 누르면 전체 행사,
 색상 버튼을 누르면 해당 분야의 행사만 보여요.
</p>
</section>

<section class="panel" id="detail">
<h2 id="selectedTitle">팝업스토어 안내</h2>
<div id="results" class="empty">
 행사 정보를 불러오는 중입니다.
</div>
</section>

<footer>
© 야무진 픽노트 · 방문 전 행사 정보를 확인하세요.
</footer>
</main>

<script>
"use strict";

const categories={
 beauty:{name:"뷰티",css:"beauty"},
 fashion:{name:"패션",css:"fashion"},
 tech:{name:"가전",css:"tech"},
 goods:{name:"캐릭터",css:"goods"},
 life:{name:"라이프",css:"life"},
 food:{name:"푸드",css:"food"}
};

// 행사 목록은 events.json에서 불러옵니다.
let events=[];
let dataReady=false;
let dataError=false;

const today=new Date();
today.setHours(12,0,0,0);

let selectedDate=new Date(today);
let selectedCategory=null;
let weekStart=monday(today);
let scrollTimer=null;

const $=id=>document.getElementById(id);

function monday(d){
 const x=new Date(
  d.getFullYear(),d.getMonth(),d.getDate(),12
 );
 x.setDate(x.getDate()-(x.getDay()+6)%7);
 return x;
}

function addDays(d,n){
 const x=new Date(d);
 x.setDate(x.getDate()+n);
 return x;
}

function key(d){
 return d.getFullYear()+"-"+
 String(d.getMonth()+1).padStart(2,"0")+"-"+
 String(d.getDate()).padStart(2,"0");
}

function matches(date,category){
 return events.filter(e=>
  e.start<=date &&
  e.end>=date &&
  (!category || e.category===category)
 );
}

function syncSelects(){
 const y=$("yearSelect");
 const m=$("monthSelect");
 y.innerHTML="";
 m.innerHTML="";

 const minYear=Math.min(
  today.getFullYear()-2,selectedDate.getFullYear()
 );
 const maxYear=Math.max(
  today.getFullYear()+5,selectedDate.getFullYear()
 );

 for(let year=minYear;year<=maxYear;year++){
  const o=document.createElement("option");
  o.value=year;
  o.textContent=year+"년";
  y.append(o);
 }

 for(let i=1;i<=12;i++){
  const o=document.createElement("option");
  o.value=i-1;
  o.textContent=i+"월";
  m.append(o);
 }

 y.value=selectedDate.getFullYear();
 m.value=selectedDate.getMonth();
}

function render(){
 syncSelects();

 const end=addDays(weekStart,6);
 $("range").textContent=
  (weekStart.getMonth()+1)+"/"+weekStart.getDate()+
  " ~ "+
  (end.getMonth()+1)+"/"+end.getDate();

 const grid=$("week");
 grid.replaceChildren();

 for(let i=0;i<7;i++){
  const d=addDays(weekStart,i);
  const date=key(d);

  const cell=document.createElement("div");
  cell.className="day";

  if(date===key(today)){
   cell.classList.add("today");
  }
  if(date===key(selectedDate)){
   cell.classList.add("selected");
  }

  const dateButton=document.createElement("button");
  dateButton.className="dateButton";
  dateButton.setAttribute(
   "aria-label",date+" 전체 팝업 보기"
  );

  if(date===key(selectedDate) &&
     selectedCategory===null){
   dateButton.classList.add("active");
  }

  const name=document.createElement("div");
  name.className="dayname";
  name.textContent=
   ["일","월","화","수","목","금","토"][d.getDay()];

  const number=document.createElement("div");
  number.className="date";
  number.textContent=d.getDate();

  dateButton.append(name,number);
  dateButton.addEventListener("click",()=>{
   selectEvent(d,null);
  });
  cell.append(dateButton);

  for(const id of Object.keys(categories)){
   const b=document.createElement("button");
   b.className="cat "+categories[id].css;
   b.textContent=categories[id].name;
   b.setAttribute(
    "aria-label",
    date+" "+categories[id].name+" 팝업 보기"
   );

   if(date===key(selectedDate) &&
      selectedCategory===id){
    b.classList.add("active");
    b.setAttribute("aria-pressed","true");
   }else{
    b.setAttribute("aria-pressed","false");
   }

   b.addEventListener("click",()=>{
    selectEvent(d,id);
   });
   cell.append(b);
  }
  grid.append(cell);
 }
}

function selectEvent(d,category){
 cancelPending();
 selectedDate=new Date(d);
 selectedCategory=category;
 render();

 scrollTimer=setTimeout(()=>{
  show(key(d),category);
  scrollTimer=null;
 },350);
}

function show(date,category){
 $("selectedTitle").textContent=
  Number(date.slice(5,7))+"월 "+
  Number(date.slice(8,10))+"일 · "+
  (category?categories[category].name:"전체")+" 팝업";

 const root=$("results");
 root.replaceChildren();
 root.className="";

 if(dataError){
  root.className="empty";
  root.textContent=
   "행사 정보를 불러오지 못했습니다. 잠시 후 새로고침해 주세요.";
  return;
 }

 if(!dataReady){
  root.className="empty";
  root.textContent="행사 정보를 불러오는 중입니다.";
  return;
 }

 const list=matches(date,category);

 if(!list.length){
  root.className="empty";
  root.textContent="등록된 팝업이 없습니다.";
 }

 for(const e of list){
  const item=document.createElement("div");
  item.className="item";

  const h=document.createElement("h3");
  h.textContent=e.name;
  item.append(h);

  

if(e.place && e.place.trim()){
  const p=document.createElement("p");

  const mapLink=document.createElement("a");
  mapLink.href="https://map.naver.com/p/search/"+
    encodeURIComponent(e.place.trim());
  mapLink.target="_blank";
  mapLink.rel="noopener noreferrer";
  mapLink.textContent="📍 "+e.place;

  mapLink.style.color="#647469";
mapLink.style.textDecoration="none";
mapLink.style.cursor="pointer";
 
  p.append(mapLink);
  item.append(p);
}


for(const line of [
  "📅 "+e.start+" ~ "+e.end,
  e.description || ""
]){
  if(!line)continue;
  const p=document.createElement("p");
  p.textContent=line;
  item.append(p);
}


  if(e.url){
   const a=document.createElement("a");
   a.className="link";
   a.href=e.url;
   a.target="_blank";
   a.rel="noopener noreferrer";
   a.textContent="행사 정보 확인 →";
   item.append(a);
  }

  if(e.blogUrl){
   const a=document.createElement("a");
   a.className="link secondary";
   a.href=e.blogUrl;
   a.target="_blank";
   a.rel="noopener noreferrer";
   a.textContent="야무진의 행사·혜택 정리 보기 →";
   item.append(a);
  }

  root.append(item);
 }

 $("detail").scrollIntoView({
  behavior:"smooth",
  block:"start"
 });
}

function cancelPending(){
 if(scrollTimer!==null){
  clearTimeout(scrollTimer);
  scrollTimer=null;
 }
}

function moveWeek(direction){
 cancelPending();
 weekStart=addDays(weekStart,direction*7);
 selectedDate=new Date(weekStart);
 selectedCategory=null;
 render();
}

$("prev").addEventListener("click",()=>{
 moveWeek(-1);
});

$("next").addEventListener("click",()=>{
 moveWeek(1);
});

function jump(){
 cancelPending();
 selectedDate=new Date(
  Number($("yearSelect").value),
  Number($("monthSelect").value),
  1,12
 );
 selectedCategory=null;
 weekStart=monday(selectedDate);
 render();
}

$("yearSelect").addEventListener("change",jump);
$("monthSelect").addEventListener("change",jump);

$("goToday").addEventListener("click",()=>{
 cancelPending();
 selectedDate=new Date(today);
 selectedCategory=null;
 weekStart=monday(today);
 render();
 show(key(today),null);
});

// 별도 파일에서 행사 정보를 가져옵니다.
async function loadEvents(){
 try{
  const response=await fetch(
   "./events.json",
   {cache:"no-store"}
  );

  if(!response.ok){
   throw new Error("HTTP "+response.status);
  }

  const data=await response.json();

  if(!Array.isArray(data)){
   throw new Error("행사 목록 형식 오류");
  }

  const required=[
 "name","category","start","end","url"
];

  for(const e of data){
   if(!e || typeof e!=="object" ||
      required.some(field=>
       typeof e[field]!=="string" || !e[field].trim()
      ) ||
      typeof e.place!=="string" ||
!categories[e.category] ||
      !/^\d{4}-\d{2}-\d{2}$/.test(e.start) ||
      !/^\d{4}-\d{2}-\d{2}$/.test(e.end) ||
      e.start>e.end ||
      !/^https?:\/\//i.test(e.url)){
    throw new Error("행사 데이터 항목 오류");
   }
  }

  events=data;
  dataReady=true;
  dataError=false;

 }catch(error){
  console.error("행사 데이터 오류:",error);
  dataReady=false;
  dataError=true;
 }

 render();
 show(key(selectedDate),selectedCategory);
}

render();
loadEvents();
</script>
</body>
</html>
